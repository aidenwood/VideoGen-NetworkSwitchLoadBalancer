<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Render Farm</title>
<style>
  :root{
    --bg:#0f1117; --panel:#181b24; --line:#252836; --txt:#e7e9ee; --dim:#8b90a0;
    --sent:#8b5cf6; --recv:#38bdf8; --done:#34d399; --fail:#f87171; --warn:#fbbf24;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font:13px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;
    padding:16px; -webkit-user-select:none; user-select:none;
  }
  h1{font-size:14px;margin:0 0 2px;letter-spacing:.2px}
  .root{color:var(--dim);font-size:11px;margin-bottom:12px;word-break:break-all}
  h2{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin:0 0 8px}

  /* tabs */
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tab{flex:1;background:var(--panel);border:1px solid var(--line);color:var(--dim);
       border-radius:9px;padding:7px 0;text-align:center;font-size:12px;cursor:pointer}
  .tab.on{color:var(--txt);border-color:#3a3f52;background:#20242f}
  .page{display:none} .page.on{display:block}

  /* dashboard */
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
  .card .n{font-size:22px;font-weight:700;line-height:1}
  .card .l{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin-top:4px}
  .card.q .n{color:var(--sent)} .card.r .n{color:var(--recv)}
  .card.d .n{color:var(--done)} .card.f .n{color:var(--fail)}
  .feed{display:flex;flex-direction:column;gap:6px}
  .ev{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
  .ev .m{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sent .dot{background:var(--sent)} .received .dot{background:var(--recv)}
  .done .dot{background:var(--done)} .failed .dot{background:var(--fail)}
  .empty{color:var(--dim);font-size:12px;padding:18px 0;text-align:center}

  /* setup */
  .banner{border:1px solid var(--line);background:var(--panel);border-radius:12px;
          padding:11px 12px;margin-bottom:12px;display:flex;gap:10px;align-items:center}
  .banner .big{font-size:18px;line-height:1}
  .banner .t{flex:1;min-width:0}
  .banner .t b{display:block;font-size:13px}
  .banner .t span{color:var(--dim);font-size:11px}
  .banner.ready{border-color:#1f6f4e}
  .banner.blocked{border-color:#6f2a2a}
  .row{display:flex;gap:8px;margin-bottom:12px}
  button{font:inherit;background:#20242f;color:var(--txt);border:1px solid var(--line);
         border-radius:9px;padding:7px 12px;cursor:pointer}
  button:hover{border-color:#3a3f52}
  button.primary{background:#2b2350;border-color:#4c3fa0}
  button.small{padding:4px 9px;font-size:11px;border-radius:7px}
  .stage{margin-bottom:14px}
  .stage > .h{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.6px;margin:0 0 6px}
  .chk{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:6px;
       display:flex;gap:9px;align-items:flex-start}
  .chk .ic{flex:0 0 auto;width:16px;text-align:center;line-height:1.35}
  .chk .body{flex:1;min-width:0}
  .chk .lbl{font-weight:600}
  .chk .det{color:var(--dim);font-size:11px;margin-top:2px;word-break:break-word}
  .chk .fix{font-size:11px;margin-top:5px;padding:6px 8px;border-radius:7px;
            background:#1e222c;border:1px solid var(--line);color:#c9cede}
  .chk .acts{margin-top:6px}
  .chk.ok{border-color:#22503c}
  .chk.warn{border-color:#5a4718}
  .chk.fail{border-color:#5a2626}
  .chk.ok .ic{color:var(--done)} .chk.warn .ic{color:var(--warn)} .chk.fail .ic{color:var(--fail)}
  .workers{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .wk{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11px}
  .wk.rendering{border-color:#1f5a7a;color:#bfe6ff}
  form.cfg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
  form.cfg label{display:block;font-size:11px;color:var(--dim);margin:0 0 3px}
  form.cfg .f{margin-bottom:9px}
  form.cfg input,form.cfg select{
    width:100%;background:#12151d;border:1px solid var(--line);color:var(--txt);
    border-radius:8px;padding:6px 8px;font:inherit;-webkit-user-select:text;user-select:text}
  form.cfg .two{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .hint{color:var(--dim);font-size:11px;margin:-4px 0 9px}
  .toast{position:fixed;left:16px;right:16px;bottom:14px;background:#20242f;border:1px solid #3a3f52;
         border-radius:10px;padding:9px 11px;font-size:12px;display:none;z-index:9}
  .toast.bad{border-color:#6f2a2a}
</style>
</head>
<body>
  <h1>LTX Mac Farm</h1>
  <div class="root" id="root">—</div>

  <div class="tabs">
    <div class="tab on" id="tab-dash">Dashboard</div>
    <div class="tab" id="tab-setup">Setup &amp; Verify</div>
  </div>

  <!-- ---------------------------------------------------------------- -->
  <div class="page on" id="page-dash">
    <div class="cards">
      <div class="card q"><div class="n" id="c-queued">0</div><div class="l">Queued</div></div>
      <div class="card r"><div class="n" id="c-running">0</div><div class="l">Running</div></div>
      <div class="card d"><div class="n" id="c-done">0</div><div class="l">Done</div></div>
      <div class="card f"><div class="n" id="c-failed">0</div><div class="l">Failed</div></div>
    </div>
    <h2>Recent pings</h2>
    <div class="feed" id="feed"></div>
  </div>

  <!-- ---------------------------------------------------------------- -->
  <div class="page" id="page-setup">
    <div class="banner" id="banner">
      <div class="big" id="b-icon">⏳</div>
      <div class="t"><b id="b-title">Checking this Mac…</b><span id="b-sub">—</span></div>
      <button class="small" id="b-recheck">Re-check</button>
    </div>

    <div class="workers" id="workers"></div>
    <div id="checks"></div>

    <h2>Settings</h2>
    <form class="cfg" id="cfg" autocomplete="off">
      <div class="two">
        <div class="f">
          <label for="f-coord">Coordinator Mac name</label>
          <input id="f-coord" placeholder="mac-studio" spellcheck="false" />
        </div>
        <div class="f">
          <label for="f-sharename">Shared folder name</label>
          <input id="f-sharename" placeholder="RenderFarm" spellcheck="false" />
        </div>
      </div>
      <div class="hint" id="h-url">smb://…</div>

      <div class="f">
        <label for="f-share">Share path on this Mac</label>
        <input id="f-share" placeholder="/Volumes/RenderFarm" spellcheck="false" />
      </div>
      <div class="two">
        <div class="f">
          <label for="f-perf">Speed profile (this Mac)</label>
          <select id="f-perf">
            <option value="full">full — dedicated render Mac</option>
            <option value="light">light — someone's daily driver</option>
          </select>
        </div>
        <div class="f">
          <label for="f-disk">Min free disk (GB)</label>
          <input id="f-disk" type="number" min="1" step="1" />
        </div>
      </div>
      <div class="f">
        <label for="f-repo">Farm scripts folder (blank = auto-detect)</label>
        <input id="f-repo" placeholder="~/Desktop/VideoGen-NetworkSwitchLoadBalancer" spellcheck="false" />
      </div>
      <div class="f">
        <label for="f-ltx">LTX2-MLX folder (blank = ~/video-gen/LTX2-MLX)</label>
        <input id="f-ltx" placeholder="~/video-gen/LTX2-MLX" spellcheck="false" />
      </div>
      <div class="row" style="margin:0">
        <button class="primary" type="submit">Save &amp; re-check</button>
        <button type="button" id="btn-mount">Mount share</button>
      </div>
    </form>
    <div class="hint" id="cfgfile" style="margin-top:8px"></div>
  </div>

  <div class="toast" id="toast"></div>

<script>
  const invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;
  const VERB = { sent:"sent", received:"received", done:"finished", failed:"failed" };
  const ICON = { sent:"📤", received:"📥", done:"✅", failed:"❌" };
  const MARK = { ok:"✅", warn:"⚠️", fail:"❌" };
  const $ = (id) => document.getElementById(id);

  /* ---------- tabs ---------- */
  let tab = "dash";
  function openTab(which){
    tab = which;
    $("tab-dash").classList.toggle("on", which === "dash");
    $("tab-setup").classList.toggle("on", which === "setup");
    $("page-dash").classList.toggle("on", which === "dash");
    $("page-setup").classList.toggle("on", which === "setup");
    if (which === "setup") verify();
  }
  window.__openTab = openTab;                 // tray menu calls this
  $("tab-dash").onclick  = () => openTab("dash");
  $("tab-setup").onclick = () => openTab("setup");

  function toast(msg, bad){
    const t = $("toast");
    t.textContent = msg;
    t.className = "toast" + (bad ? " bad" : "");
    t.style.display = "block";
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { t.style.display = "none"; }, 4200);
  }

  /* ---------- dashboard ---------- */
  function row(ev){
    const div = document.createElement("div");
    div.className = "ev " + (ev.kind || "");
    const dot = document.createElement("span");
    dot.className = "dot";
    const m = document.createElement("span");
    m.className = "m";
    const verb = VERB[ev.kind] || ev.kind || "";
    const who = (ev.kind === "sent") ? "" : (ev.host && ev.host !== "?" ? ev.host + " " : "");
    m.append((ICON[ev.kind] || "•") + " " + who + verb + " ");
    const b = document.createElement("b");
    b.textContent = ev.id || "?";
    m.append(b);
    div.append(dot, m);
    return div;
  }

  function emptyNode(text){
    const d = document.createElement("div");
    d.className = "empty";
    d.textContent = text || "Waiting for activity…";
    return d;
  }

  async function tick(){
    if(!invoke) return;
    try{
      const s = await invoke("get_state");
      $("root").textContent = s.root || "—";
      $("c-queued").textContent  = s.counts.queued;
      $("c-running").textContent = s.counts.running;
      $("c-done").textContent    = s.counts.done;
      $("c-failed").textContent  = s.counts.failed;
      const feed = $("feed");
      const nodes = (s.events && s.events.length) ? s.events.map(row) : [emptyNode()];
      feed.replaceChildren(...nodes);
    }catch(e){ /* window may be hidden before setup completes */ }
  }

  /* ---------- setup & verify ---------- */
  function checkNode(c){
    const d = document.createElement("div");
    d.className = "chk " + (c.status || "");
    const ic = document.createElement("div");
    ic.className = "ic";
    ic.textContent = MARK[c.status] || "•";
    const body = document.createElement("div");
    body.className = "body";
    const lbl = document.createElement("div");
    lbl.className = "lbl";
    lbl.textContent = c.label;
    const det = document.createElement("div");
    det.className = "det";
    det.textContent = c.detail || "";
    body.append(lbl, det);
    if (c.fix){
      const fix = document.createElement("div");
      fix.className = "fix";
      fix.textContent = c.fix;
      body.append(fix);
    }
    if (c.action){
      const wrap = document.createElement("div");
      wrap.className = "acts";
      const b = document.createElement("button");
      b.className = "small";
      b.type = "button";
      b.textContent = c.action_label || "Fix";
      b.onclick = () => doAction(c.action);
      wrap.append(b);
      body.append(wrap);
    }
    d.append(ic, body);
    return d;
  }

  async function doAction(action){
    try{
      const msg = (action === "mount_share")
        ? await invoke("mount_share")
        : await invoke("run_action", { action });
      toast(msg);
      setTimeout(verify, 1200);
    }catch(e){ toast(String(e), true); }
  }

  let verifying = false;
  async function verify(){
    if(!invoke || verifying) return;
    verifying = true;
    $("b-icon").textContent = "⏳";
    $("b-title").textContent = "Checking this Mac…";
    try{
      const r = await invoke("verify_link");

      const banner = $("banner");
      banner.className = "banner " + (r.fail ? "blocked" : "ready");
      $("b-icon").textContent = r.fail ? "❌" : (r.warn ? "⚠️" : "✅");
      $("b-title").textContent = r.fail
        ? (r.fail + " step" + (r.fail === 1 ? "" : "s") + " left before this Mac can render")
        : (r.warn ? "Connected — " + r.warn + " thing(s) worth a look" : "This Mac is fully set up");
      $("b-sub").textContent =
        r.host + (r.is_coordinator ? " (coordinator)" : "") + " · " + r.root +
        " · " + r.ok + " ok / " + r.warn + " warn / " + r.fail + " failed";

      // who's on the farm right now
      const wk = $("workers");
      if (r.workers && r.workers.length){
        wk.replaceChildren(...r.workers.map(w => {
          const s = document.createElement("span");
          s.className = "wk " + w.state;
          s.textContent = (w.state === "rendering" ? "▶ " : "○ ") + w.host +
                          (w.job ? " · " + w.job : "");
          return s;
        }));
      } else {
        wk.replaceChildren();
      }

      // checks, grouped by stage in order
      const host = $("checks");
      const groups = [];
      let cur = null;
      (r.checks || []).forEach(c => {
        if (!cur || cur.label !== c.stage_label){
          cur = { label: c.stage_label, items: [] };
          groups.push(cur);
        }
        cur.items.push(c);
      });
      host.replaceChildren(...groups.map(g => {
        const box = document.createElement("div");
        box.className = "stage";
        const h = document.createElement("div");
        h.className = "h";
        h.textContent = g.label;
        box.append(h, ...g.items.map(checkNode));
        return box;
      }));
    }catch(e){
      $("b-icon").textContent = "❌";
      $("b-title").textContent = "Couldn't run the checks";
      $("b-sub").textContent = String(e);
    }finally{ verifying = false; }
  }
  $("b-recheck").onclick = verify;

  /* ---------- config form ---------- */
  function shareUrlPreview(){
    const name = ($("f-coord").value || "…").trim();
    const share = ($("f-sharename").value || "RenderFarm").trim();
    $("h-url").textContent = "smb://" + name + ".local/" + share;
  }
  $("f-coord").addEventListener("input", shareUrlPreview);
  $("f-sharename").addEventListener("input", shareUrlPreview);

  async function loadConfig(){
    if(!invoke) return;
    try{
      const r = await invoke("get_config");
      const c = r.config || {};
      $("f-coord").value     = c.coordinator || "";
      $("f-sharename").value = c.share_name || "RenderFarm";
      $("f-share").value     = c.share_path || "";
      $("f-perf").value      = c.perf || "full";
      $("f-disk").value      = c.min_free_gb || 15;
      $("f-repo").value      = c.repo_dir || "";
      $("f-ltx").value       = c.ltx_dir || "";
      $("f-share").placeholder = (r.resolved && r.resolved.root) || "/Volumes/RenderFarm";
      $("f-ltx").placeholder   = (r.resolved && r.resolved.ltx_dir) || "";
      $("cfgfile").textContent = "Saved to " + (r.config_file || "");
      shareUrlPreview();
    }catch(e){ /* ignore */ }
  }

  $("cfg").addEventListener("submit", async (e) => {
    e.preventDefault();
    try{
      await invoke("save_config", { cfg: {
        coordinator: $("f-coord").value.trim(),
        share_path:  $("f-share").value.trim(),
        share_name:  ($("f-sharename").value.trim() || "RenderFarm"),
        perf:        $("f-perf").value,
        min_free_gb: parseInt($("f-disk").value, 10) || 15,
        ltx_dir:     $("f-ltx").value.trim(),
        lora_dir:    "",
        repo_dir:    $("f-repo").value.trim()
      }});
      toast("Settings saved — the watcher picks up the new share within 2s.");
      loadConfig();
      verify();
    }catch(err){ toast(String(err), true); }
  });

  $("btn-mount").onclick = () => doAction("mount_share");

  /* ---------- boot ---------- */
  $("feed").replaceChildren(emptyNode());
  loadConfig();
  tick();
  setInterval(tick, 2000);
  // keep the setup view honest while it's open, without hammering shell-outs
  setInterval(() => { if (tab === "setup" && document.hasFocus()) verify(); }, 15000);
</script>
</body>
</html>
