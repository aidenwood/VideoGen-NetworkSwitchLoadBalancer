# ============================================================================
# FARM-WIDE CONFIG — edit ONCE on the coordinator, applies to EVERY Mac.
# ----------------------------------------------------------------------------
# Lives at $FARM_ROOT/farm.conf on the share. Every worker re-reads it at the
# top of each poll, so a change here reaches all machines within one poll
# (~15s) — no re-running setup, no touching each Mac.
#
# Precedence, lowest to highest:
#   built-in defaults  <  this file  <  $FARM_ROOT/farm.conf.<hostname>  <  env
#
# The `: "${VAR:=value}"` form means "set VAR unless it already has a value",
# which is what gives env vars the last word. Keep that form for every entry.
#
# Per-Mac exception? Don't edit this file — drop a farm.conf.<hostname> next to
# it on the share with just the lines that differ. Example:
#     : "${PERF:=light}"
#
# THE NUMBERS BELOW COME FROM A REAL OOM INCIDENT, NOT FROM GUESSES.
# Read docs/MEMORY-INCIDENT-2026-07-28.md before changing any of them.
# ============================================================================

# --- performance profile ----------------------------------------------------
# auto  = pick from this Mac's installed RAM (the default; correct everywhere)
# full  = drops --low-ram. 64GB+ ONLY — --low-ram alone already measured 27.5GB.
# light = --low-ram + temporal tiling. Everything smaller than 64GB.
: "${PERF:=auto}"
: "${AUTO_PERF_MIN_GB:=64}"

# --- the budget -------------------------------------------------------------
# ONE ceiling per Mac, as a % of its own RAM. 28GB on a 32GB Mac, 57GB on 64GB.
# A worker prices each job BEFORE claiming it and refuses anything above this,
# releasing it back to the queue for a bigger Mac.
: "${MEM_BUDGET_PCT:=90}"

# What to do with a job this Mac can't afford:
#   block = release it back to the queue for a bigger Mac   (default, correct)
#   warn  = log the price and render it anyway              (for measuring)
#   off   = no pricing at all                               (pre-incident behaviour)
: "${ADMISSION:=block}"

# --- job pricing ------------------------------------------------------------
# peak_GB ~= megapixels * PER_MP + BASE   (video also scales by frames/97)
#
# STILL: MEASURED. 896x1216 (1.09MP) z-image, -q 4, --low-ram, LoRA, 9 steps
#        => 27.5GB peak MLX memory.
# VIDEO: EXTRAPOLATED — NOT yet measured. This is why hero 1080x1920 currently
#        prices at ~50GB and only the 64GB Mac will take it. If that's wrong it
#        is costing you three machines, so measure it (docs, "open item") and
#        correct the number here. Do NOT just lower it until jobs fit.
: "${STILL_GB_PER_MP:=25}"
: "${STILL_GB_BASE:=3}"
: "${VIDEO_GB_PER_MP:=22}"
: "${VIDEO_GB_BASE:=4}"

# Apply the budget inside the render process via MLX. Bounds MLX's buffer cache
# (enforced) and lowers its give-up threshold from the default 1.5x-working-set,
# which is larger than physical RAM and so guarantees a swap death rather than a
# clean failure. A mitigation, NOT a hard wall — admission control is the wall.
: "${MLX_CAP:=1}"

# --- OOM recovery -----------------------------------------------------------
# A jetsam kill is retryable, not a permanent failure. The backoff is load-
# bearing: in the incident an instant retry reloaded a 27.5GB model into a
# machine still recovering and was killed again — that's the runaway loop.
: "${OOM_BACKOFF:=90}"
: "${OOM_MAX_RETRY:=2}"

# --- courtesy guard ---------------------------------------------------------
# NOT OOM protection — MLX allocations are invisible to these readings. This
# only stops a worker piling a render on top of whatever the person at that Mac
# already has open. Fails open.
: "${MEM_GUARD:=1}"
: "${MIN_FREE_MEM_PCT:=10}"
: "${MAX_PRESSURE_LEVEL:=4}"     # 1 normal, 2 warn, 4 critical
: "${MAX_SWAP_USED_MB:=12288}"

# --- disk guard (not memory; here so all the limits live in one file) -------
: "${MIN_FREE_GB:=15}"

# --- misc -------------------------------------------------------------------
: "${POLL_SECS:=15}"
: "${MODEL:=dgrauet/ltx-2.3-mlx-q4}"
